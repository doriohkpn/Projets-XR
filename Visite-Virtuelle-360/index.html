		<style type="text/css" title="Default">
			/* fullscreen */
			html {
				height: 100%;
			}
			body {
				height: 100%;
				margin: 0px;
				background: black;
				color: white;
				overflow: hidden; /* disable scrollbars */
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0); /* remove highlight on tab for iOS/Android */
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}
			/* fix for scroll bars on webkit & >=Mac OS X Lion */
			::-webkit-scrollbar {
				background-color: rgba(0,0,0,0.5);
				width: 0.75em;
				height: 0.75em;
			}
			::-webkit-scrollbar-thumb {
				background-color: rgba(255,255,255,0.5);
			}

			/* ==========================================================
			   Ã‰CRAN D'ACCUEIL CeGPA-UAC (Fond marron 75% d'opacitÃ©)
			   ========================================================== */
			#splash-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(43, 27, 18, 0.75);
				z-index: 99999;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				opacity: 1;
				visibility: visible;
				transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
				user-select: none;
				-webkit-user-select: none;
				-webkit-tap-highlight-color: transparent;
			}

			#splash-screen.splash-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			@keyframes logoEntrance {
				0% {
					opacity: 0;
					transform: scale(0.78) translateY(24px);
					filter: blur(12px) drop-shadow(0 0 0 rgba(0, 0, 0, 0));
				}
				55% {
					opacity: 0.95;
					filter: blur(0px) drop-shadow(0 14px 30px rgba(0, 0, 0, 0.6));
				}
				78% {
					transform: scale(1.035) translateY(-3px);
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
					filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 25px rgba(229, 168, 35, 0.22));
				}
			}

			@keyframes logoGlowPulse {
				0% {
					filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 16px rgba(229, 168, 35, 0.16));
				}
				100% {
					filter: drop-shadow(0 14px 38px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 32px rgba(229, 168, 35, 0.38));
				}
			}

			#splash-logo {
				width: min(50vw, 230px);
				max-height: 50vh;
				object-fit: contain;
				cursor: pointer;
				animation: logoEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
				           logoGlowPulse 3.2s ease-in-out 1.1s infinite alternate;
				transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
				will-change: transform, opacity, filter;
			}

			#splash-screen:hover #splash-logo {
				transform: scale(1.045);
				filter: drop-shadow(0 16px 45px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 45px rgba(229, 168, 35, 0.45));
			}

			#splash-screen:active #splash-logo {
				transform: scale(0.97);
			}

			/* Effet d'expansion vers l'avant lors de l'entrÃ©e dans la visite */
			#splash-screen.splash-hidden #splash-logo {
				transform: scale(1.12);
				opacity: 0;
				filter: blur(8px);
				transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s ease, filter 0.65s ease;
			/* Fin splash screen */
		</style>

		<!-- Ã‰cran d'accueil CeGPA (Fond marron 75% + Logo centrÃ©) -->
		<div id="splash-screen" title="Cliquer pour entrer dans la visite">
			<img id="splash-logo" src="images/image_2.png" onerror="this.src='images/image_1.png'" alt="Logo CeGPA-UAC" />
		</div>

		<div id="container" style="width:100%;height:100%;overflow:hidden;">
		<br>Loading...<br><br>
		</div>
		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				pano.openNext('{' + params.startNode + '}', params.startView);
			}
		} else {
			var lastHash = window.location.hash;
			window.setInterval(function () {
				if (window.location.hash != lastHash) {
					lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					pano.openNext('{' + params.startNode + '}', params.startView);
				}
			}, 100);
		}
			// create the panorama player with the container
			pano=new pano2vrPlayer("container");
			pano.startNode = startNode;
			pano.startView = startView;
			// add the skin object
			skin=new pano2vrSkin(pano);
			// add the vrskin object
			vrskin=new pano2vrVrSkin(pano);
			// load the configuration
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("pano.xml");
			});

			/* Gestion du clic pour entrer dans la visite */
			document.addEventListener("DOMContentLoaded", function() {
				var splash = document.getElementById("splash-screen");
				if (splash) {
					var closeSplash = function() {
						// DÃ©bloquer l'audio pour les navigateurs
						try {
							if (window.AudioContext || window.webkitAudioContext) {
								var AudioCtx = window.AudioContext || window.webkitAudioContext;
								var ctx = new AudioCtx();
								if (ctx.state === 'suspended') {
									ctx.resume();
								}
							}
						} catch(e) {}

						// Animation de disparition douce
						splash.classList.add("splash-hidden");
						setTimeout(function() {
							splash.style.display = "none";
							if (window.pano && typeof pano.setViewerSize === "function") {
								var c = document.getElementById("container");
								if (c) pano.setViewerSize(c.offsetWidth, c.offsetHeight);
							}
						}, 650);
					};

					splash.addEventListener("click", closeSplash);
					splash.addEventListener("touchend", closeSplash);
				}
			});

			if (window.navigator.userAgent.match(/Safari/i)) {
				// fix for white borders, rotation on iPhone
				function iosHfix(e) {
					window.scrollTo(0, 1);
					var container=document.getElementById("container");
					var oh=container.offsetHeight;
					document.documentElement.style.setProperty('height', '100vh');
					if (oh!=container.offsetHeight) {
						container.style.setProperty('height',"100%");
					} else {
						container.style.setProperty('height',window.innerHeight+"px");
					}
					window.scrollTo(0, 0);
					pano.setViewerSize(container.offsetWidth, container.offsetHeight);
				};
				setTimeout(iosHfix,0);
				setTimeout(iosHfix,100);
				window.addEventListener("resize", function() {
					setTimeout(iosHfix,0);
					// hide toolbar on iPad happens with a delay
					setTimeout(iosHfix,500);
					setTimeout(iosHfix,1000);
					setTimeout(iosHfix,2000);
				});
			}
		</script>
		<noscript>
			<p><b>Please enable Javascript!</b></p>
		</noscript>
