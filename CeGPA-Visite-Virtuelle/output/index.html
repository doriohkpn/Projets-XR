<script type="text/javascript" src="skin_vr.js?ts=87778973">

		<div id="container" style="width:100%;height:100%;overflow:hidden;">

		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				pano.openNext('{' + params.startNode + '}', params.startView);
			}
		} else {
			var lastHash = window.location.hash;
			window.setInterval(function () {
				if (window.location.hash != lastHash) {
					lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					pano.openNext('{' + params.startNode + '}', params.startView);
				}
			}, 100);
		}
			// create the panorama player with the container
			pano=new pano2vrPlayer("container");
			pano.startNode = startNode;
			pano.startView = startView;
			pano.setQueryParameter("ts=87778973")
			// add the skin object
			skin=new pano2vrSkin(pano);
			// add the vrskin object
			vrskin=new pano2vrVrSkin(pano);
			// Ambient Audio Manager - Invisible, zero-UI, responsive to any gesture
			var AmbientAudio = (function() {
				var hasUnlocked = false;
				function resumeContext() {
					try {
						if (window.pano) {
							if (pano.SA && pano.SA.state === 'suspended') {
								pano.SA.resume();
							}
							if (pano.setSoundsPermitted) {
								pano.setSoundsPermitted(true);
							}
						}
					} catch(e) {}
				}
				function play() {
					resumeContext();
					if (window.pano && pano.playSound) {
						if (!pano.isPlaying || !pano.isPlaying('son_fond')) {
							pano.playSound('son_fond', '0');
						}
					}
					try {
						var audios = document.querySelectorAll('audio.ggmedia');
						audios.forEach(function(a) {
							if (a.paused) {
								a.play().catch(function(){});
							}
						});
					} catch(e) {}
				}
				function onUserGesture(e) {
					resumeContext();
					play();
					setTimeout(function() {
						resumeContext();
						play();
						if (window.pano && pano.SA && pano.SA.state === 'running') {
							hasUnlocked = true;
							removeListeners();
						}
					}, 200);
				}
				function removeListeners() {
					var events = ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'];
					events.forEach(function(evt) {
						window.removeEventListener(evt, onUserGesture, { capture: true });
						document.removeEventListener(evt, onUserGesture, { capture: true });
						var c = document.getElementById('container');
						if (c) c.removeEventListener(evt, onUserGesture, { capture: true });
					});
				}
				function attachListeners() {
					var events = ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'];
					events.forEach(function(evt) {
						window.addEventListener(evt, onUserGesture, { capture: true, passive: true });
						document.addEventListener(evt, onUserGesture, { capture: true, passive: true });
						var c = document.getElementById('container');
						if (c) c.addEventListener(evt, onUserGesture, { capture: true, passive: true });
					});
				}
				return {
					init: function() {
						attachListeners();
						if (window.pano) {
							pano.addListener('configloaded', function() {
								play();
							});
							pano.addListener('changenode', function() {
								play();
							});
						}
						play();
						setTimeout(play, 300);
						setTimeout(play, 800);
					},
					play: play,
					onUserGesture: onUserGesture
				};
			})();
			AmbientAudio.init();
			function playBackgroundMusic() {
				if (window.AmbientAudio) AmbientAudio.play();
			}
			window.playBackgroundMusic = playBackgroundMusic;
			// load the configuration
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("pano.xml?ts=87778973");
				setTimeout(playBackgroundMusic, 150);
			});
			if (window.navigator.userAgent.match(/Safari/i)) {
				// fix for white borders, rotation on iPhone
				function iosHfix(e) {
					window.scrollTo(0, 1);
					var container=document.getElementById("container");
					var oh=container.offsetHeight;
					document.documentElement.style.setProperty('height', '100vh');
					if (oh!=container.offsetHeight) {
						container.style.setProperty('height',"100%");
					} else {
						container.style.setProperty('height',window.innerHeight+"px");
					}
					window.scrollTo(0, 0);
					pano.setViewerSize(container.offsetWidth, container.offsetHeight);
				};
				setTimeout(iosHfix,0);
				setTimeout(iosHfix,100);
				window.addEventListener("resize", function() {
					setTimeout(iosHfix,0);
					// hide toolbar on iPad happens with a delay
					setTimeout(iosHfix,500);
					setTimeout(iosHfix,1000);
					setTimeout(iosHfix,2000);
				});
			}
		</script>
